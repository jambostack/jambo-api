# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        name: JAMBOSESSID
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax

    # Trusted proxies: allow SYMFONY_TRUSTED_PROXIES env variable to override X-Forwarded-* headers.
    # On o2switch (shared), leave empty; behind a load-balancer set to the proxy CIDR.
    trusted_proxies: '%env(default::SYMFONY_TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
