doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file).
        # For MariaDB on o2switch/cPanel, specify 'mariadb-10.6.18' or 'mariadb-10.11.8'
        # (or append ?serverVersion=mariadb-10.6.18 to DATABASE_URL) to ensure
        # full DBAL 4/5 compatibility and bypass runtime introspection queries.
        # server_version is set per environment below (dev=MySQL 8, prod=MariaDB o2switch)

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        dbal:
            # o2switch uses MariaDB — declare server_version explicitly to avoid DBAL runtime introspection.
            # Adjust to the actual MariaDB version reported by `SELECT @@version` on o2switch.
            server_version: 'mariadb-10.6.18'
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
